<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كتالوج المنتجات — Crestline Product Catalog</title>
  <meta name="description" content="كتالوج منتجات كريست لاين: خضروات وفواكه مصرية طازجة، مجمدات IQF، ومبيدات زراعية — Crestline product catalog: Egyptian fresh produce, IQF frozen, and crop protection.">
  <link rel="canonical" href="https://crestline-impex.com/catalog.html">
  <link rel="icon" href="logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#0f2747;--accent:#c9a24a;--dark:#0a1a30;--line:#e3e6ec;--muted:#5d6676}
    *{box-sizing:border-box}
    body{margin:0;font-family:Tajawal,Inter,system-ui,sans-serif;color:#14213a;background:#eef1f5}
    html[lang=en] body{font-family:Inter,Tajawal,system-ui,sans-serif}
    .bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--primary);color:#fff}
    .bar button,.bar a{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;text-decoration:none}
    .bar .pr{background:var(--accent);color:var(--dark)}
    .bar .ln{background:rgba(255,255,255,.12);color:#fff}
    .page{max-width:900px;margin:22px auto;background:#fff;box-shadow:0 10px 40px rgba(15,39,71,.08)}
    .cover{min-height:560px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:50px 40px;background:linear-gradient(160deg,var(--primary),var(--dark));color:#fff}
    .cover img{width:140px;height:140px;object-fit:contain;margin-bottom:20px}
    .cover h1{font-size:40px;margin:0 0 6px}
    .cover .sub{color:#e8d9b0;font-size:18px;margin:0 0 22px}
    .cover .intro{max-width:620px;line-height:1.8;color:#dfe6f1;margin:0 0 28px}
    .cover .ct{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;font-size:14px;color:#fff}
    .cover .ct span{direction:ltr;unicode-bidi:embed}
    .cat{padding:34px 40px 10px}
    .cat h2{font-size:24px;color:var(--primary);border-bottom:3px solid var(--accent);padding-bottom:8px;margin:0 0 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .cat h2 small{font-size:13px;color:var(--muted);font-weight:600}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;break-inside:avoid;page-break-inside:avoid;background:#fff}
    .card .im{aspect-ratio:4/3;background:#f3f5f8}
    .card .im img{width:100%;height:100%;object-fit:cover;display:block}
    .card .bd{padding:14px 16px 16px}
    .card h3{margin:0 0 6px;font-size:18px;color:var(--primary)}
    .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:#eef6ee;color:#1a7f37;margin-bottom:8px}
    .badge.imp{background:#eef2fb;color:#1f4ea3}
    .card p{margin:0 0 10px;font-size:13.5px;line-height:1.7;color:#3b4555}
    .sp{margin:0;padding:0;list-style:none;font-size:12.5px;border-top:1px dashed var(--line);padding-top:8px}
    .sp li{display:flex;gap:8px;padding:2px 0}
    .sp b{color:var(--muted);font-weight:600;min-width:92px}
    .foot{margin-top:24px;padding:22px 40px;background:var(--primary);color:#fff;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:center;font-size:13px}
    .foot span{direction:ltr;unicode-bidi:embed}
    .load{padding:80px;text-align:center;color:var(--muted)}
    @media(max-width:640px){.grid{grid-template-columns:1fr}.cat{padding:26px 16px 6px}.cover h1{font-size:30px}}
    @page{size:A4;margin:10mm}
    @media print{
      body{background:#fff}.bar{display:none}.page{margin:0;max-width:none;box-shadow:none}
      .cover{min-height:270mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .cat{break-before:page;padding:0 0 6px}.foot,.badge{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>
</head>
<body>
  <div class="bar"><button class="pr" id="pr">🖨 تحميل / طباعة PDF</button><a class="ln" id="ln" href="?lang=en">English</a><a class="ln" href="./">← الموقع</a></div>
  <div class="page" id="cat"><div class="load">…</div></div>
  <script>
  (function () {
    if (window.top !== window.self) { try { window.top.location.replace(location.href); } catch (e) {} }
    const LANG = /lang=en/.test(location.search) ? 'en' : 'ar';
    const t = v => v == null ? '' : (typeof v === 'object' ? (v[LANG] || v.ar || v.en || '') : String(v));
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const T = v => esc(t(v));
    const U = {
      ar: { print: '🖨 تحميل / طباعة PDF', other: 'English', back: '← الموقع', title: 'كتالوج المنتجات', exp: 'تصدير', imp: 'استيراد', season: 'الموسم', origin: 'المنشأ', moq: 'أقل كمية', packing: 'التعبئة', incoterms: 'شروط التسليم', code: 'الكود', hs: 'HS Code', items: 'منتج' },
      en: { print: '🖨 Download / Print PDF', other: 'العربية', back: 'Website →', title: 'Product Catalog', exp: 'Export', imp: 'Import', season: 'Season', origin: 'Origin', moq: 'Min. order', packing: 'Packing', incoterms: 'Delivery terms', code: 'Code', hs: 'HS Code', items: 'items' }
    }[LANG];
    document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'en' ? 'ltr' : 'rtl';
    document.getElementById('pr').textContent = U.print;
    const ln = document.getElementById('ln'); ln.textContent = U.other; ln.href = LANG === 'en' ? '?' : '?lang=en';
    document.querySelector('.bar a[href="./"]').textContent = U.back;
    document.getElementById('pr').onclick = () => window.print();
    fetch('site.json?t=' + Date.now()).then(r => r.json()).then(d => {
      const st = d.settings || {}, c = st.colors || {}, root = document.documentElement.style;
      if (c.primary) root.setProperty('--primary', c.primary); if (c.accent) root.setProperty('--accent', c.accent); if (c.dark) root.setProperty('--dark', c.dark);
      const name = t(st.name), sub = t(st.subtitle);
      document.title = `${U.title} — ${name}`;
      const secs = (d.sections || []).filter(s => s.type === 'products' && s.visible !== false);
      const items = secs.flatMap(s => (s.items || []).filter(p => !p.hidden));
      const order = [...new Set([...secs.flatMap(s => (s.categories || []).map(x => t(x.name))), ...items.map(p => t(p.category))])].filter(Boolean);
      if (items.some(p => !t(p.category))) order.push('');
      const contacts = [...(st.phones || []).map(p => `<span>☎ ${esc(p.number)}</span>`), st.whatsapp ? `<span>WhatsApp +${esc(st.whatsapp)}</span>` : '', st.email ? `<span>✉ ${esc(st.email)}</span>` : '', st.domain ? `<span>🌐 ${esc(st.domain)}</span>` : ''].join('');
      const spec = p => {
        const rows = [[U.season, t(p.season)], [U.origin, t(p.origin)], ...(p.specs || []).map(s => [t(s.label), t(s.value)]), [U.moq, t(p.moq)], [U.packing, t(p.packing)], [U.incoterms, p.incoterms], [U.code, p.code], [U.hs, p.hs]].filter(r => r[0] && r[1]);
        return rows.length ? `<ul class="sp">${rows.map(r => `<li><b>${esc(r[0])}</b><span>${esc(r[1])}</span></li>`).join('')}</ul>` : '';
      };
      const card = p => `<div class="card">${p.image ? `<div class="im"><img src="${esc(p.image)}" alt="${T(p.name)}"></div>` : ''}<div class="bd"><h3>${T(p.name)}</h3><span class="badge${p.trade === 'import' ? ' imp' : ''}">${p.trade === 'import' ? U.imp : p.trade === 'both' ? U.exp + ' / ' + U.imp : U.exp}</span><p>${T(p.description)}</p>${spec(p)}</div></div>`;
      const intro = secs[0] ? t(secs[0].text) : '';
      document.getElementById('cat').innerHTML = `
        <section class="cover">${st.logo ? `<img src="${esc(st.logo)}" alt="${esc(name)}">` : ''}<h1>${esc(name)}</h1><p class="sub">${esc(sub)} — ${U.title}</p>${intro ? `<p class="intro">${esc(intro)}</p>` : ''}<div class="ct">${contacts}</div></section>
        ${order.map(cat => { const list = items.filter(p => t(p.category) === cat); return list.length ? `<section class="cat"><h2>${esc(cat || U.title)} <small>${list.length} ${U.items}</small></h2><div class="grid">${list.map(card).join('')}</div></section>` : ''; }).join('')}
        <div class="foot"><b>${esc(name)}</b>${contacts}</div>`;
    }).catch(() => { document.getElementById('cat').innerHTML = '<div class="load">تعذّر تحميل الكتالوج</div>'; });
  })();
  </script>
</body>
</html>
